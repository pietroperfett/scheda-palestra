<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Scheda">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Scheda Palestra</title>
<style>
:root{--yl:#ffd60a;--bg:#f2f2f7;--c:#fff;--tx:#000;--t2:#8e8e93;--sep:#c6c6c8;--ac:#007aff;--gr:#34c759;--rd:#ff3b30;--fl:#7676801f}
@media(prefers-color-scheme:dark){:root{--bg:#000;--c:#1c1c1e;--tx:#fff;--sep:#38383a;--ac:#0a84ff;--gr:#30d158;--rd:#ff453a;--fl:#7676803d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,"SF Pro Text",system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(170px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;outline:0}
h1{font-size:34px;margin:8px 0 2px;letter-spacing:-.5px}h3{margin:0 0 4px;font-size:17px}
.sub,.m{color:var(--t2);font-size:14px;margin:0}
.card{background:var(--c);border-radius:20px;padding:14px;margin:12px 0}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.ti{width:68px;height:68px;flex:none;border-radius:16px;background:linear-gradient(135deg,#5ac8fa,#007aff) center/cover;display:grid;place-items:center;font-size:32px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;margin:0 0 4px}
.tag.f{background:#007aff22;color:var(--ac)}.tag.i{background:#34c75922;color:var(--gr)}
.nt{font-size:15px;margin:6px 0}
.set{display:grid;grid-template-columns:16px 1fr 1fr 44px 44px;gap:5px;align-items:center;margin:8px 0}
.st{display:flex;background:var(--fl);border-radius:12px;overflow:hidden;height:40px}
.st button{width:28px;border:0;background:none;color:var(--ac);font-size:22px}
.st input{flex:1;min-width:0;text-align:center;border:0;background:none;font-size:17px;font-weight:600}
.rp{height:44px;border:0;border-radius:12px;background:var(--fl);text-align:center;font-size:20px;font-weight:600;width:100%}
.ck{height:44px;border:0;border-radius:12px;background:var(--fl);color:var(--t2);font-size:20px}
.ok .ck{background:var(--gr);color:#fff}
.lk{background:none;border:0;color:var(--ac);font-size:16px;padding:8px 0}.lk.rd{color:var(--rd)}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--ac);color:#fff;font-size:17px;font-weight:600;padding:15px;margin:12px 0}
.btn.g{background:var(--c);color:var(--ac)}
.nav{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:.5px solid var(--sep)}.row:first-child{border:0}
#tabs{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;padding:8px 0 calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep)}
#tabs button{flex:1;border:0;background:none;color:var(--t2);font-size:11px}
#tabs button b{display:block;font-size:22px;font-weight:400}#tabs .on{color:var(--ac)}
#tm{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--c) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:12px 14px;box-shadow:0 4px 24px #0003;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#tt{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
#tm button{border:0;background:var(--fl);color:var(--ac);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
.bar{width:100%;height:5px;background:var(--fl);border-radius:3px;overflow:hidden}
#tp{height:100%;width:0;background:var(--ac);transition:width .25s linear}
#sh{position:fixed;z-index:9;inset:0;background:#0006;display:flex;align-items:flex-end}
#sh>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
#sh label{display:block;font-size:13px;color:var(--t2);margin:10px 0 4px}
#sh input,#sh select,#sh textarea{width:100%;border:0;border-radius:12px;background:var(--c);padding:12px;font-size:17px}
#pg{position:sticky;top:env(safe-area-inset-top);z-index:4;margin:0 -16px;padding:8px 16px 10px;background:var(--bg);box-shadow:0 -70px 0 var(--bg)}
#pg .bar{height:16px;margin-top:6px;border-radius:8px}#pgb{height:100%;width:0;background:var(--gr);border-radius:8px;transition:width .3s}
#ts{position:fixed;z-index:20;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 8px);background:var(--c);border-radius:18px;padding:12px 16px;box-shadow:0 6px 28px #0004;font-weight:600;text-align:center;transition:transform .3s,opacity .3s}#ts.h{transform:translateY(-160%);opacity:0}
.pill{background:var(--yl);color:#000;border-radius:99px;padding:3px 11px;font-size:15px;font-weight:700}
.yl{background:var(--yl);color:#000}.yl .m{color:#000a}.go{width:40px;height:40px;border-radius:50%;background:#000;color:var(--yl);display:grid;place-items:center;flex:none;font-size:16px}
.tag.yt{background:var(--yl);color:#000}
::selection{background:var(--yl);color:#000}.card h3{-webkit-user-select:text;user-select:text}
.cp{border:0;background:var(--fl);color:var(--t2);border-radius:8px;font-size:12px;padding:3px 8px;margin-left:4px;vertical-align:middle}
.set.ok .st,.set.no .st{opacity:.5}.no .ck{background:var(--rd);color:#fff}
.nta{width:100%;border:0;border-radius:12px;background:var(--fl);padding:10px;font-size:16px;margin-top:8px;resize:none}
.big{display:block;width:100%;border:0;border-radius:22px;background:var(--rd);color:#fff;font-size:24px;font-weight:700;padding:26px;margin:20px 0}
#tm.dn{background:var(--gr);color:#fff;animation:pu .7s 4}#tm.dn button{background:#fff3;color:#fff}#tm.dn .bar{background:#fff4}#tm.dn #tp{background:#fff}#tm.dn #tt{font-size:42px}@keyframes pu{50%{transform:scale(1.03)}}
#ts.y{background:var(--yl);color:#000}
.pill{font-variant-numeric:tabular-nums}.pt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.gear{border:0;background:var(--c);color:var(--ac);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;margin-top:8px}
.ic{border:0;background:none;color:var(--t2);padding:2px 6px;vertical-align:middle;line-height:0}
.sr{color:var(--tx);font-weight:700}
.coach{border-left:3px solid var(--yl);padding-left:10px;margin:8px 0;font-weight:600;font-size:15px}
.sg{display:flex;justify-content:space-between;align-items:center;background:#34c75922;color:var(--gr);border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:600;font-size:15px}.sg button{border:0;background:var(--gr);color:#fff;border-radius:9px;padding:5px 12px;font-weight:600}
.rr{height:44px;border:0;border-radius:12px;background:var(--fl);color:var(--t2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.rr small{font-size:9px;font-weight:600;letter-spacing:.3px}.rr b{font-size:19px;margin-top:2px}.rr.on{background:#007aff22;color:var(--ac)}
.seg{display:flex;background:var(--fl);border-radius:10px;padding:2px;margin:10px 0}.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--tx)}.seg .on{background:var(--c)}.card .seg .on{background:var(--bg)}
.sech{margin:18px 4px 0;font-size:13px;text-transform:uppercase;color:var(--t2);letter-spacing:.4px}
[hidden]{display:none!important}
</style></head><body>
<div id="app"></div>
<div id="tm" hidden><div id="tt"></div><button data-a="tm" data-v="-15">−15</button><button data-a="tm" data-v="15">+15</button><button data-a="tx">✕</button><div class="bar"><div id="tp"></div></div></div>
<nav id="tabs"><button data-a="tab" data-t="home"><b>🏋️</b>Scheda</button><button data-a="tab" data-t="rep"><b>📊</b>Report</button></nav>
<div id="sh" hidden></div><input type="file" id="bi" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),K='gym.v1';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),num=v=>parseFloat(String(v).replace(',','.'))||0;
const hms=s=>s>=3600?Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):fmt(s);
const T={F:['Forza','f'],I:['Ipertrofia','i'],FI:['Forza / Ipertrofia','f']};
const ic=n=>/squat|leg|affondi|calf/i.test(n)?'🦵':/curl|tricip|pushdown|estens|supin|finger|wrist/i.test(n)?'💪':/crunch/i.test(n)?'🔥':/trazion|remat|face|shrug/i.test(n)?'🧗':'🏋️';
const tile=e=>`<div class="ti"${e.img?` style="background-image:url(${e.img})"`:''}>${e.img?'':ic(e.n)}</div>`;
const X=(...a)=>({id:uid(),n:a[0],t:a[1],s:a[2],r:a[3],rest:a[4],rir:a[5],note:a[6]||'',step:2.5,img:''});
function seed(){return[
{id:uid(),n:'Giorno A',sub:'Upper + forza',req:1,wd:1,ex:[
X('Squat con bilanciere','F',3,'4–6',180,'2','Scendi controllato, busto stabile, non sacrificare la profondità.'),
X('Panca piana con bilanciere','F',3,'4–6',180,'2','Scapole stabili, piedi piantati. Usa i fermi del rack.'),
X('Trazioni alla sbarra','I',3,'6–10',150,'1–2','Sotto le 6 rep pulite: lat machine 3 × 8–12.'),
X('Romanian deadlift','I',2,'8–10',120,'2','Bacino indietro, bilanciere vicino alle gambe, schiena neutra.'),
X('Alzate laterali con manubri','I',4,'12–20',75,'1–2','Niente slancio, braccia leggermente piegate.'),
X('Curl manubri su panca inclinata','I',3,'8–12',90,'1–2','Gomiti fermi, sfrutta l’allungamento.'),
X('Estensioni tricipiti al cavo sopra la testa','I',3,'10–15',90,'1–2','Allunga bene, gomiti fermi.'),
X('Crunch al cavo','I',2,'12–15',75,'2','Fletti l’addome, non tirare con le braccia.'),
X('Reverse curl','I',2,'12–15',90,'1–2','Avambracci'),X('Wrist curl','I',2,'15–20',60,'1–2','Avambracci')]},
{id:uid(),n:'Giorno B',sub:'Full body + braccia',req:1,wd:4,ex:[
X('Military press con bilanciere','F',3,'5–8',150,'2','Addome contratto, glutei attivi, niente iperestensione lombare.'),
X('Rematore con bilanciere','FI',3,'6–10',150,'2','Busto inclinato e stabile, niente slancio.'),
X('Panca inclinata con manubri','I',3,'8–12',120,'1–2','Inclinazione 20–30°.'),
X('Leg press','I',3,'8–12',120,'2','Bacino appoggiato, schiena stabile.'),
X('Leg curl','I',2,'10–15',90,'1–2'),
X('Hammer curl','I',3,'8–12',90,'1–2','Presa neutra, polsi dritti.'),
X('Pushdown al cavo con corda','I',3,'10–15',90,'1–2'),
X('Face pull','I',2,'15–20',75,'2'),
X('Calf raises con manubri','I',2,'12–20',75,'1–2'),
X('Dumbbell shrug','I',2,'12–15',90,'1–2','Contrazione breve in alto, scendi lento.'),
X('Finger curl','I',2,'15–20',60,'1–2','Avambracci'),X('Supinazione con manubrio leggero','I',2,'12–15',60,'1–2','Carico leggero, lenta, per lato.')]},
{id:uid(),n:'Giorno C',sub:'Leg day',req:0,wd:6,ex:[
X('Front squat','I',3,'6–10',150,'2'),X('Leg extension','I',3,'10–15',90,'1–2'),
X('Affondi con manubri','I',2,'10–12',120,'2','Per gamba.'),X('Romanian deadlift','I',3,'8–10',120,'2'),
X('Leg curl','I',3,'10–15',90,'1–2'),X('Calf raises','I',4,'12–20',75,'1–2')]}]}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch{}S=S||{days:seed(),logs:[],cur:null,t:null};S.days.forEach(d=>{if(d.wd==null)d.wd={'Giorno A':1,'Giorno B':4,'Giorno C':6}[d.n]??-1});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch{alert('Memoria piena: esporta un backup')}};
const V={tab:S.cur?'sess':'home',day:null,edit:false,rep:null};let pimg='',iv,wl,ac;
const last=id=>{for(let i=S.logs.length-1;i>=0;i--){const x=S.logs[i].ex.find(e=>e.id===id);if(x)return x}};
const vol=l=>l.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);
const dt=(t,o)=>new Date(t).toLocaleDateString('it-IT',o);
const pc=()=>{let t=0,d=0;S.cur.ex.forEach(x=>x.sets.forEach(z=>{t++;d+=z.d?1:0}));return[d,t,t?Math.round(d/t*100):0]};
const pl=e=>S.plan&&S.plan.items[e.id],ICN='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>',OKI='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',GEAR='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.6" stroke-width="3" stroke-dasharray="3.38 3.38"/><circle cx="12" cy="12" r="6.2" stroke-width="2.4"/><circle cx="12" cy="12" r="2.3" stroke-width="2"/></svg>';
function sug(e){const l=last(e.id),it=pl(e);if(!l||(it&&it.kg!=null))return 0;const hi=+((((it&&it.r)||e.r).match(/\d+/g)||[]).pop()),ts=parseInt(e.rir)||0;if(!hi||!l.sets.every(s=>s.r>=hi&&(s.q==null||s.q>=ts)))return 0;return Math.round((Math.max(...l.sets.map(s=>s.w))+(e.step||2.5))*100)/100}
function oggi(){const n=new Date(),td=S.days.find(d=>d.wd===n.getDay());if(!td||S.logs.some(l=>l.dayId===td.id&&new Date(l.at).toDateString()===n.toDateString()))return'';return`<div class="card yl nav" data-a="day" data-d="${td.id}"><div><b style="font-size:18px">Oggi in palestra 🏋️</b><p class="m">${esc(td.n)} · ${esc(td.sub)}</p></div><span class="go">▶︎</span></div>`}
function home(){const due=S.bwf&&Date.now()>=nb();return`<div class="nav"><h1>Scheda</h1><button class="gear" data-a="set">${GEAR}</button></div><p class="sub">${dt(Date.now(),{weekday:'long',day:'numeric',month:'long'})}</p>`+(S.cur?`<button class="btn" data-a="res">▶︎ Riprendi sessione · ${pc()[2]}%</button>`:oggi())+(due?`<div class="card nav"><div><b>⚖️ È ora di pesarti</b><p class="m">Registra il peso di oggi</p></div><button class="btn" style="width:auto;margin:0;padding:10px 16px" data-a="bw">Registra</button></div>`:'')+S.days.map(d=>{const lg=[...S.logs].reverse().find(l=>l.dayId===d.id);return`<div class="card" data-a="day" data-d="${d.id}"><div class="nav"><h3>${esc(d.n)}</h3><span class="tag ${d.req?'f':'i'}">${d.req?'Obbligatorio':'Facoltativo'}</span></div><p class="sub">${esc(d.sub)} · ${d.ex.length} esercizi</p><p class="m">${lg?'Ultima volta: '+dt(lg.at,{day:'numeric',month:'short'}):'Mai svolto'}</p></div>`}).join('')+`<button class="lk" style="display:block;margin:16px auto 0;font-size:12px;opacity:.35" data-a="nd">+ giorno</button>`}
function dayv(){const d=S.days.find(x=>x.id===V.day);return`<div class="nav"><button class="lk" data-a="back">‹ Scheda</button><button class="lk" data-a="edit">${V.edit?'Fine':'Modifica'}</button></div><h1>${esc(d.n)}</h1><p class="sub">${esc(d.sub)}</p><div class="card">`+d.ex.map(e=>{const l=last(e.id),it=pl(e);return`<div class="row" data-a="ex" data-e="${e.id}">${tile(e)}<div style="flex:1"><h3>${esc(e.n)}</h3><span class="tag ${T[e.t][1]}">${T[e.t][0]}</span><div class="m"><span class="sr">${(it&&it.s)||e.s} × ${esc((it&&it.r)||e.r)}</span> · Rec ${fmt(e.rest)} · RIR ${esc(e.rir)}${l?' · '+Math.max(...l.sets.map(s=>s.w))+' kg':''}</div>${it?`<div class="m">Coach · ${esc(it.t)}</div>`:''}</div>${V.edit?'<span class="m">›</span>':''}</div>`}).join('')+`</div>`+(V.edit?`<button class="btn g" data-a="ex" data-e="new">+ Aggiungi esercizio</button><button class="btn g" data-a="rn">Rinomina giorno</button><button class="btn g" style="color:var(--rd)" data-a="dd">Elimina giorno</button>`:`<button class="btn" data-a="start">Avvia sessione</button>`)}
function sess(){const c=S.cur,day=S.days.find(x=>x.id===c.day),al=pc()[2]===100;return`<div id="pg"><div class="nav"><b id="el" class="pill"></b><b id="pgt" class="pt"></b></div><div class="bar"><div id="pgb"></div></div></div><div class="nav"><span></span><button class="lk rd" data-a="fin">Termina</button></div><h1>${esc(day.n)}</h1><p class="sub">${esc(day.sub)}</p>`+c.ex.map((x,xi)=>{const e=day.ex.find(y=>y.id===x.id);if(!e)return'';const l=last(e.id),it=pl(e),sg=sug(e),dn=x.sets.every(z=>z.d);return`<section class="card"><div class="hd">${tile(e)}<div><h3>${esc(e.n)}<button class="ic" data-a="cp" data-n="${esc(e.n)}">${ICN}</button></h3><span class="tag ${T[e.t][1]}">${T[e.t][0]}</span><div class="m"><span class="sr">${(it&&it.s)||e.s} × ${esc((it&&it.r)||e.r)}</span> · Rec ${fmt(e.rest)} · RIR ${esc(e.rir)}</div></div></div>${it?`<p class="coach"><span class="m">Coach</span> ${esc(it.t)}</p>`:''}${sg&&!dn?`<div class="sg"><span>↑ Sali a ${sg} kg</span><button data-a="sg" data-x="${xi}" data-kg="${sg}">Applica</button></div>`:''}${e.note?`<p class="nt">${esc(e.note)}</p>`:''}${l?`<p class="m">Ultima volta: ${l.sets.map(s=>s.w+'×'+s.r).join('  ')}</p>${l.note?`<p class="m">📝 ${esc(l.note)}</p>`:''}`:''}`+x.sets.map((s,si)=>{const L=s.d?' disabled':'',a=`data-x="${xi}" data-s="${si}"`;return`<div class="set${s.d===1?' ok':s.d===2?' no':''}"><b>${si+1}</b><div class="st"><button data-a="w" ${a} data-v="-1"${L}>−</button><input inputmode="decimal" data-k="w" ${a} value="${esc(s.w)}" placeholder="kg"${L}><button data-a="w" ${a} data-v="1"${L}>+</button></div><div class="st"><button data-a="r" ${a} data-v="-1"${L}>−</button><input inputmode="numeric" data-k="r" ${a} value="${esc(s.r)}" placeholder="${esc(e.r.split('–')[0])}"${L}><button data-a="r" ${a} data-v="1"${L}>+</button></div><button class="rr${s.q==null?'':' on'}" data-a="rr" ${a}><small>RIR</small><b>${s.q==null?'–':s.q}</b></button><button class="ck" data-a="ck" ${a}>${s.d===2?'✕':'✓'}</button></div>`}).joi function plan(txt){const items={},miss=[];let cur=null;txt.split(/\n+/).forEach(raw=>{const ln=raw.replace(/\s+/g,' ').trim();if(!/\d/.test(ln)||/^esercizio\b/i.test(ln))return;const nm=ln.match(/^\D*/)[0],tk=nz(nm).filter(w=>!SW.has(w));let best=null,bs=.3;S.days.forEach(d=>d.ex.forEach(e=>{const et=nz(e.n).filter(w=>!SW.has(w)),m=et.filter(w=>tk.some(t=>pk(t)===pk(w))).length;if(!m)return;const v=m/et.length+m*.05+(d===cur?.4:0);if(v>bs){bs=v;best=[d,e]}}));if(!best){if(/[x×]/i.test(ln))miss.push(ln);return}cur=best[0];const e=best[1],ew=new Set(nz(e.n).map(pk)),ws=nm.trim().split(' ').filter(Boolean);let k=0;while(k<ws.length&&nz(ws[k]).length&&nz(ws[k]).every(w=>ew.has(pk(w))))k++;const t=(ws.slice(k).join(' ')+' '+ln.slice(nm.length)).trim(),sr=t.match(/(\d+)\s*[x×]\s*(\d+(?:\s*[–-]\s*\d+)?)/i),kg=/sopra|scatto/i.test(t)?null:(t.match(/(\d+(?:[.,]\d+)?)\s*kg/i)||[])[1];items[e.id]={t,kg:kg?num(kg):null,s:sr?+sr[1]:null,r:sr?sr[2].replace(/\s/g,'').replace('-','–'):null}});S.plan={at:Date.now(),items};save();return{n:Object.keys(items).length,miss}}

case'r':{const z=c.ex[x].sets[s],lo=parseInt(xe().r)||1;if(z.d)return;let v=num(z.r);v=!v?(D.v>0?lo:0):Math.max(0,v+ +D.v);z.r=v||'';b.parentElement.querySelector('input').value=z.r;save();return}
case'rr':{const z=c.ex[x].sets[s],q=[1,2,3,4,0];z.q=z.q==null?1:q[q.indexOf(z.q)+1]??null;b.className='rr'+(z.q==null?'':' on');b.lastChild.textContent=z.q==null?'–':z.q;save();return}

case'add':{const q=c.ex[x].sets,p=q[q.length-1]||{};q.push({w:p.w||'',r:p.r||'',d:0});save();nre();break}

render(['add','edit','sg','bws','bwd'].includes(a))});
